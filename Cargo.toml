[package]
name = "pinto-chat"
version = "0.1.0"
edition = "2024"
description = "Pinto Chat Desktop, native GPUI build"
publish = false

[[bin]]
name = "pinto-chat"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
qrcode = { version = "0.14", default-features = false }
dirs = "5"
dotenvy = "0.15"
futures = "0.3"
urlencoding = "2"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
