name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Built apps talk to production. Local `cargo run` keeps the dev API, and a
  # PINTO_API_BASE_URL in the environment or .env still overrides this.
  PINTO_BUILD_API_BASE_URL: https://api.pinto-app.com
  # Only main writes the cache; PRs and tags restore main's cache read-only,
  # so the repository's 10 GB cache budget isn't spent on one-off branches.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ env.SAVE_CACHE }}

      - name: Build Apple Silicon
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Bundle Pinto Chat.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP="dist/Pinto Chat.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/pinto-chat" \
            target/aarch64-apple-darwin/release/pinto-chat \
            target/x86_64-apple-darwin/release/pinto-chat
          cp assets/icons/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pinto Chat</string>
            <key>CFBundleDisplayName</key><string>Pinto Chat</string>
            <key>CFBundleIdentifier</key><string>com.pinto.chat-desktop</string>
            <key>CFBundleExecutable</key><string>pinto-chat</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # Ad-hoc signature so Apple Silicon will launch it (not notarized).
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/pinto-chat-${VERSION}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pinto-chat-macos-universal
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ env.SAVE_CACHE }}

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pinto-chat.exe "dist/Pinto Chat.exe"
          Compress-Archive -Path "dist/Pinto Chat.exe" -DestinationPath "dist/pinto-chat-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pinto-chat-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ### macOS
            The app is not signed with an Apple Developer ID, so macOS blocks it the first time. Unzip it, move `Pinto Chat.app` to Applications, then run once:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Pinto Chat.app"
            ```

            ### Windows
            Unzip and run `Pinto Chat.exe`. If SmartScreen warns about an unknown publisher, choose More info, then Run anyway.
